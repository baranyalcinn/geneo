spring:
  banner:
    charset: UTF-8 # Banner için karakter kodlaması
  messages:
    encoding: UTF-8 # Mesajlar için karakter kodlaması
  datasource:
    url: jdbc:postgresql://localhost:5432/FamilyTreeDB?characterEncoding=UTF-8 # Veritabanı bağlantısı için karakter kodlaması
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Bu ayar veritabanı şemasını otomatik günceller, dikkatli olun.
    show-sql: false # Geliştirme sırasında true yapmak faydalı olabilir.
    open-in-view: false # Performans sorunlarına yol açabilir, genellikle false önerilir.
    properties:
      hibernate:
        format-sql: false # SQL loglarını daha okunaklı formatlar.
  cache:
    type: CAFFEINE # Önbellek sağlayıcısı olarak Caffeine'i kullan.
    cache-names:
      - relationshipPaths
      - relationshipCache
      - pathCache
      - ancestorCache
      - familyGraphCache
      - gameQuestionCache
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=600s,recordStats # High-performance cache config
server: # Sunucu geneli karakter kodlaması ayarları
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true